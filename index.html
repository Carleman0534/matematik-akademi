<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matematik Akademi</title>
<!-- Dosyadan açınca siteye yönlendirir. Uygulama bir sunucu ve veritabanı gerektirdiği için bu dosya tek başına çalışan site değildir. -->
<meta http-equiv="refresh" content="2; url=https://matematik-akademi-alpha.vercel.app/giris">
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --card:#fff; --line:#e2e8f0; --brand:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#e2e8f0; --muted:#94a3b8; --card:#111827; --line:#1f2937; --brand:#818cf8; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  .box { width:100%; max-width:380px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 20px; }
  .logo { width:56px; height:56px; margin:0 auto 12px; border-radius:16px; background:#4f46e5; color:#fff; font-size:32px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:4px 0; color:var(--muted); font-size:14px; }
  a.btn { display:block; margin-top:16px; padding:12px; border-radius:10px; background:#4f46e5; color:#fff; font-weight:700; text-decoration:none; }
  a.alt { display:inline-block; margin-top:12px; color:var(--brand); font-size:13px; }
</style>
</head>
<body>
  <main class="box">
    <div class="logo">∑</div>
    <h1>Matematik Akademi</h1>
    <p>Siteye yönlendiriliyorsunuz…</p>
    <a class="btn" href="https://matematik-akademi-alpha.vercel.app/giris">Giriş sayfasını aç</a>
    <a class="alt" href="http://localhost:3000/giris">Bilgisayarımda çalışan sürüm (localhost:3000)</a>
  </main>
</body>
</html>
