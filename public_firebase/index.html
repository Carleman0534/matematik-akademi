<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematik Akademi - Çevrimiçi LGS ve Akıllı Öğrenme Platformu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>∑</text></svg>">
  <meta http-equiv="refresh" content="2; url=https://matematik-akademi-alpha.vercel.app/giris">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.75rem;
      padding: 2.5rem 2rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      font-size: 32px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1.25rem;
      margin: 0 auto 1.5rem auto;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.5);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: var(--text-muted);
      font-size: 0.925rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      background-color: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 1rem;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.4);
    }
    .footer-text {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .countdown {
      font-weight: 700;
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">∑</div>
    <div class="badge">
      <span class="badge-dot"></span>
      Firebase Hosting Canlıda Aktif
    </div>
    <h1>Matematik Akademi</h1>
    <p>
      LGS Matematik Hazırlık, Akıllı Soru Bankası, Deneme Sınavları ve Veli Takip Platformuna aktarılıyorsunuz...
    </p>

    <a href="https://matematik-akademi-alpha.vercel.app/giris" class="btn" id="goBtn">
      <span>Giriş Sayfasına Git</span>
      <span>→</span>
    </a>

    <div class="footer-text">
      <span class="countdown" id="timer">2</span> saniye içinde otomatik yönlendirileceksiniz.
    </div>
  </div>

  <script>
    let timeLeft = 2;
    const timerElem = document.getElementById('timer');
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerElem.textContent = timeLeft;
      } else {
        clearInterval(interval);
        window.location.href = "https://matematik-akademi-alpha.vercel.app/giris";
      }
    }, 1000);
  </script>
</body>
</html>
